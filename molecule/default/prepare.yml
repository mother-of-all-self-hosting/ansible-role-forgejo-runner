---
- name: Prepare Forgejo Runner Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Forgejo Runner Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Forgejo Runner Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Forgejo Runner Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: vfs

# A Forgejo Runner is only meaningful against a Forgejo instance: the role's
# systemd unit registers the runner during pre-start, and that registration
# needs a live instance and a registration token minted by it.
#
# Deploying Forgejo here rather than in converge.yml keeps converge focused on
# the role under test, and keeps the credentials stable across converge runs
# (a token that changed every run would re-render the systemd unit and break
# Molecule's idempotence check). The credentials are written to files so that
# converge.yml and verify.yml can pick them up in their own playbook runs.
- name: Deploy a Forgejo instance for the Forgejo Runner to register against
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for the helper Forgejo
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-forgejo
      loop_control:
        loop_var: role_name

    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure the helper Forgejo systemd service is started
      ansible.builtin.systemd_service:
        name: "{{ forgejo_runner_molecule_forgejo_identifier }}.service"
        state: started

    # An unconfigured Forgejo serves nothing but its installation wizard and
    # routes no API at all, so this endpoint answering is what tells an
    # installed instance apart from a merely running one.
    - name: Wait for the helper Forgejo API to answer (up to 10m)
      ansible.builtin.uri:
        url: "http://localhost:{{ forgejo_runner_molecule_forgejo_bind_port }}/api/v1/version"
        method: GET
        status_code: [200, 404, 500, 502, 503]
        return_content: true
      register: forgejo_runner_molecule_forgejo_api
      until: forgejo_runner_molecule_forgejo_api.status == 200
      retries: 120
      delay: 5

    - name: Assert the helper Forgejo API is installed and answering
      ansible.builtin.assert:
        that: forgejo_runner_molecule_forgejo_api.status == 200
        fail_msg: "The helper Forgejo API did not answer with 200 ({{ forgejo_runner_molecule_forgejo_api.status }})"
        success_msg: "The helper Forgejo reports {{ forgejo_runner_molecule_forgejo_api.json.version }}"

    - name: Ensure the Forgejo Runner Molecule state directory exists
      ansible.builtin.file:
        path: /root/forgejo-runner-molecule
        state: directory
        mode: "0700"

    - name: Check whether the helper Forgejo credentials have been minted already
      ansible.builtin.stat:
        path: /root/forgejo-runner-molecule/admin-token
      register: forgejo_runner_molecule_admin_token_stat

    - name: Mint the helper Forgejo credentials
      when: not forgejo_runner_molecule_admin_token_stat.stat.exists
      block:
        - name: Ensure an administrator exists on the helper Forgejo
          ansible.builtin.command:
            cmd: >-
              docker exec {{ forgejo_runner_molecule_forgejo_identifier }}
              forgejo admin user create
              --admin
              --username {{ forgejo_runner_molecule_admin_username }}
              --password {{ forgejo_runner_molecule_admin_password }}
              --email {{ forgejo_runner_molecule_admin_email }}
              --must-change-password=false
          register: forgejo_runner_molecule_admin_creation
          changed_when: "'successfully created' in forgejo_runner_molecule_admin_creation.stdout"
          failed_when: >-
            forgejo_runner_molecule_admin_creation.rc != 0
            and 'already exists' not in forgejo_runner_molecule_admin_creation.stderr

        - name: Generate an API token for the helper Forgejo administrator
          ansible.builtin.command:
            cmd: >-
              docker exec {{ forgejo_runner_molecule_forgejo_identifier }}
              forgejo admin user generate-access-token
              --username {{ forgejo_runner_molecule_admin_username }}
              --token-name molecule
              --scopes all
              --raw
          register: forgejo_runner_molecule_admin_token_creation
          changed_when: true

        - name: Persist the helper Forgejo administrator API token
          ansible.builtin.copy:
            content: "{{ forgejo_runner_molecule_admin_token_creation.stdout | trim }}"
            dest: /root/forgejo-runner-molecule/admin-token
            mode: "0600"

    - name: Check whether a Forgejo Runner registration token has been minted already
      ansible.builtin.stat:
        path: /root/forgejo-runner-molecule/registration-token
      register: forgejo_runner_molecule_registration_token_stat

    - name: Mint a Forgejo Runner registration token
      when: not forgejo_runner_molecule_registration_token_stat.stat.exists
      block:
        - name: Generate a Forgejo Runner registration token
          ansible.builtin.command:
            cmd: >-
              docker exec {{ forgejo_runner_molecule_forgejo_identifier }}
              forgejo actions generate-runner-token
          register: forgejo_runner_molecule_registration_token_creation
          changed_when: true

        - name: Persist the Forgejo Runner registration token
          ansible.builtin.copy:
            content: "{{ forgejo_runner_molecule_registration_token_creation.stdout | trim }}"
            dest: /root/forgejo-runner-molecule/registration-token
            mode: "0600"
