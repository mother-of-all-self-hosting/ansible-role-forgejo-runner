---
- name: Include roles for Forgejo Runner Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Generated and registered by prepare.yml against the helper Forgejo. Read
    # from disk rather than re-registered, so that the values (which end up in
    # the systemd unit) are the same on every converge run and the idempotence
    # check stays honest.
    - name: Read the Forgejo Runner connection uuid and secret
      ansible.builtin.slurp:
        src: "/root/forgejo-runner-molecule/{{ item }}"
      loop:
        - connection-uuid
        - connection-secret
      register: forgejo_runner_molecule_connection_files

    - name: Set the Forgejo Runner connection facts
      ansible.builtin.set_fact:
        forgejo_runner_connection_uuid: "{{ forgejo_runner_molecule_connection_files.results[0].content | b64decode | trim }}"
        forgejo_runner_registration_token: "{{ forgejo_runner_molecule_connection_files.results[1].content | b64decode | trim }}"

    - name: Include roles for Forgejo Runner Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Forgejo Runner service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Forgejo Runner systemd service is started
      ansible.builtin.systemd_service:
        name: forgejo-runner.service
        state: started
